# Default company policies and roles of the innovation hub, loaded into Lorebase by `npm run lorebase:seed`.
# Kind Rule holds every policy: numbers the world reads (engine keys, see RT_RULE_KEYS in server/src/rt/world.ts)
# and policies people read and may follow or break (strategic themes in category `strategy`, conduct rules).
# This file is the only place where they have defaults; the simulation reads the live values from Lorebase.
# Texts are what the people of the hub read (Italian).
rules:

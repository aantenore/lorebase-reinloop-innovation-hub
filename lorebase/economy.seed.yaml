# The work economy of the innovation hub, loaded into Lorebase by `npm run lorebase:seed`.
# Resource records (base items and work artifacts) and the Signal records go to `main`, and so
# do the recipes known from the start. Every Breakthrough and the recipes it unlocks go to the
# hidden branch (`economy.hiddenBranch` in config/game.json). A recipe input may name a signal
# category with `@<category>`: any carried signal of that category satisfies it.
resources:
  - code: food
    name: "Caffè"
    category: food
    perishable: true
    decay_per_day: 0.5
    nourish: 1
    source: tile
    description: "Caffè preso dalle macchine della zona relax. Riduce lo stress ma si raffredda in fretta."
  - code: wood
    name: "Materiale da lavagna"
    category: material
    perishable: false
    source: tile
    description: "Post-it, pennarelli e fogli lasciati sulle scrivanie degli uffici e delle sale riunioni. Serve per allestire lavagne e postazioni."
  - code: insight
    name: "Insight"
    category: artifact
    perishable: true
    decay_per_day: 0.15
    source: craft
    description: "Osservazione non ovvia che collega un'esigenza reale a un'opportunità di prodotto. È il punto di partenza di ogni idea."
  - code: nota_fattibilita
    name: "Nota di fattibilità"
    category: artifact
    perishable: true
    decay_per_day: 0.15
    source: craft
    description: "Breve valutazione tecnica che indica cosa è realizzabile, con quali componenti e quali vincoli principali."
  - code: mappa_utenti
    name: "Mappa degli utenti"
    category: artifact
    perishable: true
    decay_per_day: 0.15
    source: craft
    description: "Sintesi dei segmenti di utenti, dei loro compiti ricorrenti e dei punti di frizione. Orienta le scelte di esperienza d'uso."
  - code: stima_dati
    name: "Stima sui dati"
    category: artifact
    perishable: true
    decay_per_day: 0.15
    source: craft
    description: "Valutazione di quali dati servono, dove si trovano e quanto sono affidabili. Indica se l'idea regge su basi quantitative."
  - code: analisi_rischio
    name: "Analisi del rischio"
    category: artifact
    perishable: true
    decay_per_day: 0.15
    source: craft
    description: "Elenco ragionato dei rischi di sicurezza, privacy e conformità di un'idea, con le mitigazioni possibili."
  - code: sizing_mercato
    name: "Dimensionamento di mercato"
    category: artifact
    perishable: true
    decay_per_day: 0.15
    source: craft
    description: "Stima della dimensione del mercato raggiungibile e della disponibilità a pagare dei clienti individuati."
  - code: concept
    name: "Concept di prodotto"
    category: artifact
    perishable: true
    decay_per_day: 0.15
    source: craft
    description: "Descrizione strutturata di un'idea di prodotto: problema, utenti, proposta di valore e approccio tecnico di massima."
  - code: stress_test
    name: "Stress test"
    category: artifact
    perishable: true
    decay_per_day: 0.15
    source: craft
    description: "Verifica critica di un concept rispetto ai problemi reali: punti deboli, obiezioni e condizioni in cui l'idea fallisce."
  - code: blueprint_agentico
    name: "Blueprint agentico"
    category: artifact
    perishable: true
    decay_per_day: 0.15
    source: craft
    description: "Schema architetturale di un prodotto basato su agenti autonomi: ruoli, strumenti, controlli e limiti di autonomia."
  - code: concept_sicuro
    name: "Concept sicuro"
    category: artifact
    perishable: true
    decay_per_day: 0.15
    source: craft
    description: "Concept di prodotto rivisto con la protezione dei dati integrata fin dall'origine, insieme alle misure di sicurezza previste."
  - code: modello_dati
    name: "Modello dei dati"
    category: artifact
    perishable: true
    decay_per_day: 0.15
    source: craft
    description: "Progetto del ciclo dei dati di un prodotto, in cui l'uso genera dati che ne migliorano il valore nel tempo."
  - code: kit_dx
    name: "Kit developer experience"
    category: artifact
    perishable: true
    decay_per_day: 0.15
    source: craft
    description: "Insieme di strumenti, guide ed esempi che rendono semplice per gli sviluppatori adottare e integrare un prodotto."
  - code: lavagna_idee
    name: "Lavagna delle idee"
    category: structure
    perishable: false
    source: craft
    durability: 3
    decay_per_day: 1
    description: "Lavagna allestita su una casella per lavorare insieme alle idee. Si consuma in pochi giorni."

# Signals: raw material of the hub, gathered in the rooms. Grouped by category.
signals:
  # research (lab)
  - code: research_modelli_piccoli_nicchia
    name: "Modelli piccoli alla pari dei grandi"
    category: research
    source: biome
    biomes: [lab]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Uno studio mostra che modelli di piccole dimensioni, adattati a compiti ristretti, eguagliano modelli molto più grandi con una frazione dei costi di esecuzione."
  - code: research_retrieval_grafi
    name: "Retrieval migliore con grafi strutturati"
    category: research
    source: biome
    biomes: [lab]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Un articolo riporta che il recupero di informazioni su grafi di conoscenza strutturati risponde meglio alle domande multi-passaggio rispetto alla sola ricerca per similarità."
  - code: research_verifica_formale_codice
    name: "Verifica formale del codice generato"
    category: research
    source: biome
    biomes: [lab]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Nuovi risultati mostrano che il codice prodotto da modelli generativi può essere verificato formalmente su proprietà semplici, riducendo i difetti che arrivano in produzione."
  - code: research_costo_energetico_inferenza
    name: "Costo energetico dell'inferenza"
    category: research
    source: biome
    biomes: [lab]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Una misurazione su carichi reali indica che l'inferenza pesa più dell'addestramento sul consumo energetico complessivo. Cresce l'interesse per tecniche di caching e batching."
  - code: research_valutazione_agenti
    name: "Valutare gli agenti sul lungo periodo"
    category: research
    source: biome
    biomes: [lab]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Un benchmark su compiti a più passaggi evidenzia che gli agenti falliscono per errori cumulativi, non per singole risposte sbagliate. Mancano strumenti di valutazione adeguati."
  - code: research_dati_sintetici
    name: "Dati sintetici per domini rari"
    category: research
    source: biome
    biomes: [lab]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Esperimenti indicano che dati sintetici ben filtrati migliorano i modelli nei domini con pochi esempi reali, ma amplificano i pregiudizi se non vengono controllati."
  - code: research_prompt_injection
    name: "Prompt injection negli strumenti"
    category: research
    source: biome
    biomes: [lab]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Uno studio mostra che istruzioni nascoste in pagine web e documenti inducono gli agenti con accesso a strumenti a eseguire azioni non richieste, aggirando le difese più comuni."
  # trend (lab)
  - code: trend_agenti_autonomi
    name: "Agenti autonomi nei flussi di lavoro"
    category: trend
    source: biome
    biomes: [lab]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Le aziende passano dagli assistenti conversazionali ad agenti che eseguono attività complete, come aprire ticket, aggiornare sistemi e preparare report, con supervisione umana ridotta."
  - code: trend_inferenza_edge
    name: "Inferenza sul dispositivo"
    category: trend
    source: biome
    biomes: [lab]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Chip dedicati nei portatili e nei dispositivi industriali permettono di eseguire modelli localmente, con latenza minima e senza inviare dati all'esterno."
  - code: trend_modelli_open_weight
    name: "Modelli open-weight in produzione"
    category: trend
    source: biome
    biomes: [lab]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Molte aziende adottano modelli con pesi aperti, personalizzati e ospitati in proprio, per ridurre la dipendenza dai fornitori e controllare i costi."
  - code: trend_webassembly_server
    name: "WebAssembly lato server"
    category: trend
    source: biome
    biomes: [lab]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "WebAssembly si diffonde come ambiente di esecuzione isolato e portabile per funzioni e plugin, con avvii quasi istantanei e un perimetro di sicurezza molto stretto."
  # trend (lounge)
  - code: trend_platform_engineering
    name: "Platform engineering come prodotto interno"
    category: trend
    source: biome
    biomes: [lounge]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Sempre più organizzazioni costruiscono piattaforme interne self-service e le trattano come prodotti, con roadmap e metriche di adozione tra i team di sviluppo."
  - code: trend_passkey
    name: "Passkey al posto delle password"
    category: trend
    source: biome
    biomes: [lounge]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Le passkey diventano il metodo di accesso predefinito in molti servizi consumer. Le aziende iniziano a chiedere lo stesso livello di sicurezza per i sistemi interni."
  - code: trend_osservabilita_llm
    name: "Osservabilità per applicazioni LLM"
    category: trend
    source: biome
    biomes: [lounge]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "I team che portano in produzione applicazioni basate su modelli linguistici cercano di tracciare prompt, costi, latenze e qualità delle risposte, ma gli strumenti classici non bastano."
  - code: trend_data_contracts
    name: "Data contract tra team"
    category: trend
    source: biome
    biomes: [lounge]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "I team dati adottano contratti formali sulla struttura e sulla qualità dei dati scambiati, per evitare che una modifica a monte rompa silenziosamente analisi e modelli."
  # pain (lounge)
  - code: pain_onboarding_lento
    name: "Onboarding troppo lento"
    category: pain
    source: biome
    biomes: [lounge]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Un'ingegnere appena arrivata racconta che ha impiegato tre settimane per avere un ambiente funzionante e fare la prima modifica in produzione."
  - code: pain_ci_instabile
    name: "Pipeline di CI instabili"
    category: pain
    source: biome
    biomes: [lounge]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Gli sviluppatori si lamentano di test intermittenti che falliscono a caso. Ormai rilanciano la pipeline senza leggere l'errore e perdono ore ogni settimana."
  - code: pain_alert_fatigue
    name: "Troppi alert, nessuna priorità"
    category: pain
    source: biome
    biomes: [lounge]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Chi è di reperibilità riceve decine di notifiche a notte, in gran parte inutili. Alla fine silenzia i canali e rischia di perdere l'allarme che conta davvero."
  - code: pain_costi_cloud_imprevisti
    name: "Sorprese nella fattura cloud"
    category: pain
    source: biome
    biomes: [lounge]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Il responsabile finanziario scopre a fine mese che la spesa cloud è raddoppiata e nessun team sa spiegare quale servizio abbia causato l'aumento."
  - code: pain_troppe_dashboard
    name: "Troppe dashboard, nessuna risposta"
    category: pain
    source: biome
    biomes: [lounge]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Per capire se un rilascio è andato bene bisogna aprire sei dashboard diverse, con metriche che non coincidono. Ogni team si fida solo della propria."
  - code: pain_docs_obsolete
    name: "Documentazione di onboarding obsoleta"
    category: pain
    source: biome
    biomes: [lounge]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Le guide per i nuovi arrivati descrivono strumenti dismessi da mesi. Si finisce per chiedere ai colleghi, che interrompono il proprio lavoro per rispondere."
  - code: pain_colli_approvazione
    name: "Approvazioni che bloccano le release"
    category: pain
    source: biome
    biomes: [lounge]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Ogni modifica deve passare da quattro approvazioni manuali. Una correzione urgente resta ferma per giorni perché i revisori sono in ferie o sommersi di richieste."
  - code: pain_segreti_nei_repo
    name: "Segreti dimenticati nei repository"
    category: pain
    source: biome
    biomes: [lounge]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Un audit interno trova chiavi di accesso e password in chiaro nella cronologia di decine di repository. Nessuno sa quali siano ancora valide."
  # market (plaza)
  - code: market_consolidamento_osservabilita
    name: "Consolidamento tra fornitori di osservabilità"
    category: market
    source: biome
    biomes: [plaza]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Diversi fornitori di strumenti di osservabilità si stanno fondendo o vengono acquisiti. I clienti temono rincari e cercano alternative aperte e interoperabili."
  - code: market_calo_prezzi_inferenza
    name: "Calo dei prezzi dell'inferenza"
    category: market
    source: biome
    biomes: [plaza]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Il costo per milione di token è sceso di oltre la metà in un anno. Casi d'uso prima antieconomici, come l'analisi di interi archivi documentali, diventano sostenibili."
  - code: market_budget_verso_ai
    name: "Budget spostati verso l'AI"
    category: market
    source: biome
    biomes: [plaza]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Le direzioni IT riducono la spesa in licenze tradizionali per finanziare progetti di intelligenza artificiale, ma pretendono un ritorno misurabile entro dodici mesi."
  - code: market_cloud_sovrano_europa
    name: "Domanda di cloud sovrano in Europa"
    category: market
    source: biome
    biomes: [plaza]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Enti pubblici e aziende regolamentate europee chiedono infrastrutture gestite sotto giurisdizione locale. I grandi fornitori cloud rispondono con offerte dedicate, ancora poco mature."
  - code: market_pmi_automazione
    name: "Le PMI adottano l'automazione"
    category: market
    source: biome
    biomes: [plaza]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Le piccole e medie imprese iniziano ad automatizzare fatturazione, assistenza e magazzino, ma non hanno personale tecnico e cercano soluzioni pronte da configurare."
  - code: market_carenza_talenti_sicurezza
    name: "Carenza di esperti di sicurezza"
    category: market
    source: biome
    biomes: [plaza]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Le posizioni aperte per specialisti di sicurezza restano scoperte per mesi. Le aziende valutano strumenti che automatizzino triage e risposta ai primi livelli di incidente."
  - code: market_acquisti_consolidati_saas
    name: "Stop alla proliferazione di strumenti SaaS"
    category: market
    source: biome
    biomes: [plaza]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Gli uffici acquisti stanno riducendo il numero di abbonamenti software e preferiscono piattaforme che ne sostituiscano più d'uno, anche a costo di rinunciare a qualche funzione."
  # regulation (plaza)
  - code: regulation_ai_act_obblighi
    name: "Obblighi dell'AI Act per i sistemi ad alto rischio"
    category: regulation
    source: biome
    biomes: [plaza]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "L'AI Act europeo richiede documentazione tecnica, gestione del rischio e supervisione umana per i sistemi ad alto rischio. I fornitori devono dimostrarlo con evidenze verificabili."
  - code: regulation_nis2
    name: "Requisiti della direttiva NIS2"
    category: regulation
    source: biome
    biomes: [plaza]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "La direttiva NIS2 estende gli obblighi di sicurezza e di notifica degli incidenti a molti più settori, comprese le filiere di fornitura. Le sanzioni coinvolgono anche i vertici aziendali."
  - code: regulation_residenza_dati
    name: "Vincoli di residenza dei dati"
    category: regulation
    source: biome
    biomes: [plaza]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Le autorità di controllo ribadiscono che i dati personali dei cittadini europei devono restare in aree con tutele adeguate. I trasferimenti verso fornitori extra-UE richiedono garanzie aggiuntive."
  - code: regulation_accessibilita
    name: "Atto europeo sull'accessibilità"
    category: regulation
    source: biome
    biomes: [plaza]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "L'atto europeo sull'accessibilità impone che servizi digitali come e-commerce e banking siano utilizzabili da persone con disabilità. Molti siti esistenti non sono conformi."
  # customer (meeting)
  - code: customer_banca_audit_ai
    name: "Banca: audit delle decisioni automatiche"
    category: customer
    source: biome
    biomes: [meeting]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Una banca ci dice in call che per usare modelli nella valutazione del credito deve poter ricostruire e mostrare al regolatore ogni singola decisione automatica."
  - code: customer_retail_previsioni_spiegabili
    name: "Retail: previsioni di domanda spiegate"
    category: customer
    source: biome
    biomes: [meeting]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Un distributore retail ha previsioni di domanda accurate, ma i responsabili di negozio non le usano perché non capiscono perché il sistema suggerisca certi ordini."
  - code: customer_ospedale_on_prem
    name: "Ospedale: tutto deve restare on-premise"
    category: customer
    source: biome
    biomes: [meeting]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Una struttura sanitaria vuole sfruttare l'intelligenza artificiale sulle cartelle cliniche, ma i dati non possono lasciare la rete interna e non ha competenze per gestire modelli."
  - code: customer_saas_billing_a_consumo
    name: "SaaS: capire il consumo dei clienti"
    category: customer
    source: biome
    biomes: [meeting]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Un'azienda SaaS passa alla fatturazione a consumo e chiede analisi che spieghino quali clienti usano cosa, per prevedere ricavi e individuare chi rischia di abbandonare."
  - code: customer_logistica_integrazione_legacy
    name: "Logistica: sistemi legacy da integrare"
    category: customer
    source: biome
    biomes: [meeting]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Un operatore logistico gestisce le spedizioni con un sistema di vent'anni fa. Vuole nuove funzioni intelligenti senza sostituirlo e senza fermare le operazioni."
  - code: customer_assicurazione_sinistri
    name: "Assicurazione: sinistri su documenti non strutturati"
    category: customer
    source: biome
    biomes: [meeting]
    gather_yield: 1
    perishable: true
    decay_per_day: 0.3
    description: "Una compagnia assicurativa riceve migliaia di pratiche con foto, moduli e referti. Gli addetti passano gran parte del tempo a ricopiare dati prima di valutare il sinistro."

# Known from the start. A key like "@trend" accepts any carried signal of that category.
recipes:
  - code: sintesi_insight
    name: "Sintetizzare un insight"
    description: "Mettere in relazione una tendenza tecnologica con un problema reale per ricavarne un'osservazione utile."
    inputs:
      "@trend": 1
      "@pain": 1
    outputs:
      insight: 1
    minutes: 20
  - code: insight_da_ricerca
    name: "Insight da una ricerca"
    description: "Leggere un risultato di ricerca alla luce di un problema concreto per estrarne un'opportunità."
    role: ricercatore
    inputs:
      "@research": 1
      "@pain": 1
    outputs:
      insight: 1
    minutes: 15
  - code: nota_fattibilita
    name: "Scrivere una nota di fattibilità"
    description: "Valutare se un insight è realizzabile, appoggiandosi a un risultato di ricerca."
    role: architetto
    inputs:
      insight: 1
      "@research": 1
    outputs:
      nota_fattibilita: 1
    minutes: 25
  - code: mappa_utenti
    name: "Costruire la mappa degli utenti"
    description: "Incrociare un insight con quanto detto dai clienti per descrivere chi userebbe il prodotto e come."
    role: ux_designer
    inputs:
      insight: 1
      "@customer": 1
    outputs:
      mappa_utenti: 1
    minutes: 25
  - code: stima_dati
    name: "Stimare i dati necessari"
    description: "Verificare con i segnali di mercato quali dati servono a un'idea e se sono realmente disponibili."
    role: data_scientist
    inputs:
      insight: 1
      "@market": 1
    outputs:
      stima_dati: 1
    minutes: 25
  - code: analisi_rischio
    name: "Analizzare i rischi"
    description: "Confrontare un insight con un cambiamento normativo per individuare rischi di conformità e sicurezza."
    role: security
    inputs:
      insight: 1
      "@regulation": 1
    outputs:
      analisi_rischio: 1
    minutes: 25
  - code: sizing_mercato
    name: "Dimensionare il mercato"
    description: "Combinare una notizia di mercato con le parole di un cliente per stimare l'ampiezza dell'opportunità."
    role: venture_lead
    inputs:
      "@market": 1
      "@customer": 1
    outputs:
      sizing_mercato: 1
    minutes: 20
  - code: tesi_prodotto
    name: "Formulare la tesi di prodotto"
    description: "Unire un insight e la mappa degli utenti in un concept con una proposta di valore chiara."

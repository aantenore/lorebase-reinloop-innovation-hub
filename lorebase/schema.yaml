# Domain `hub`: the company policies and the roles of an innovation hub where LLM agents generate
# and evaluate IT product ideas. Every number of the simulation is a policy (Kind Rule, kept under
# its historical name); roles are Role Records; signals, work artifacts, methods (Recipe) and
# breakthroughs make the work economy; ideas live on their own `idea/` branches (Kind Idea, with
# Review Records) and reach `main`, the portfolio, only when the investment committee approves them.
format: lorebase.schema/v1

domain:
  id: hub
  display_name: Innovation hub
  description: Policies, roles, signals and the idea portfolio of an innovation hub of agents.
  default_branch: main

kinds:
  Rule:
    description: One company policy (a law of the simulation), read by the world and consulted by the agents.
    primary_key: [code]
    title_attribute: code
    attributes:
      code:
        description: Stable rule identifier used by the simulation engine, snake_case.
        type: string
        required: true
        constraints:
          pattern: '^[a-z][a-z0-9_]*$'
      value:
        description: Numeric value of the rule.
        type: decimal(12,4)
        required: true
      text:
        description: Narrative wording of the rule as the agents read it.
        type: text
        required: true
        searchable: true
      category:
        description: Area of life the rule governs.
        type: {enum: [survival, economy, climate, society, time, company, ideas, strategy, wellbeing]}
        required: true
        indexed: true
      unit:
        description: Unit of the value, for display.
        type: string

  Role:
    description: A role a person can hold in the company, with the description the person reads about it.
    primary_key: [code]
    title_attribute: title
    attributes:
      code:
        description: Stable role identifier used by the roster, snake_case.
        type: string
        required: true
        constraints:
          pattern: '^[a-z][a-z0-9_]*$'
      title:
        description: Name of the role as people read it.
        type: string
        required: true
      description:
        description: What holding this role means in society, as people read it.
        type: text
        required: true
      move_factor:
        description: Multiplier of the base walking speed for people holding this role (real-time world).
        type: decimal(6,3)
      work_factor:
        description: Multiplier of the base working speed for people holding this role (real-time world).
        type: decimal(6,3)

  Chronicle:
    description: One entry of the company newsletter (hires, departures, groups, policies, ideas, promotions, quarterly reviews), appended by the real-time world.
    primary_key: [code]
    title_attribute: text
    attributes:
      code:
        description: Unique id of the entry, minted by the world (session, day, minute and sequence).
        type: string
        required: true
      session:
        description: Id of the world run the entry belongs to.
        type: string
        required: true
        indexed: true
      day:
        description: Day of the world on which the event happened.
        type: integer
        required: true
      minute:
        description: Minute of the day (0-1439) at which the event happened.
        type: integer
        required: true
      event:
        description: What kind of event this is.
        type: {enum: [birth, death, arrival, departure, group_formed, group_dissolved, laws_changed, discovery, family_founded, law_proposed, law_breach, idea_proposed, idea_submitted, idea_approved, idea_killed, promotion, quarter_review]}
        required: true
        indexed: true
      text:
        description: The event as people of the world would tell it.
        type: text
        required: true
        searchable: true
      actors:
        description: Names of the people involved, comma separated.
        type: string

  Team:
    description: A team of the company, founded at the first hire mentored by people who had none. Who joined thanks to whom is told by the newsletter's hiring entries.
    primary_key: [code]
    title_attribute: name
    attributes:
      code:
        description: Unique id of the family, minted by the world (session and sequence).
        type: string
        required: true
      name:
        description: Name of the family as people say it.
        type: string
        required: true
        searchable: true
      founder:
        description: Name of the person who founded it.
        type: string
        required: true
      founded_day:
        description: Day of the world on which it was founded.
        type: integer
        required: true
      session:
        description: Id of the world run it belongs to.
        type: string
        required: true
        indexed: true

  Insight:
    description: An entry of a role's playbook - something people holding that role came to believe about the work, accepted by a peer of the same role.
    primary_key: [code]
    title_attribute: text
    attributes:
      code:
        description: Unique id of the insight, minted by the world.
        type: string
        required: true
      role:
        description: Code of the role whose shared consciousness this belongs to.
        type: string
        required: true
        indexed: true
      text:
        description: The insight, as its author wrote it (Italian).
        type: text
        required: true
        searchable: true
      confidence:
        description: How sure the author is, from 0 to 1.
        type: decimal(4,3)
        required: true
      author:
        description: Name of the person who shared it.
        type: string
        required: true
      reviewer:
        description: Name of the peer who accepted or rejected it.
        type: string
      day:
        description: Day of the world on which it was shared.
        type: integer
        required: true
      evidence:
        description: What the author saw or lived that supports it.
        type: text
        searchable: true
      status:
        description: proposed (waiting for a peer), accepted (part of the role's consciousness), retired (no longer held).
        type: {enum: [proposed, accepted, retired]}
        required: true
        indexed: true

  Resource:
    description: Something people can carry, take, make, use or set up (coffee, whiteboard material, work artifacts, structures).
    primary_key: [code]
    title_attribute: name
    attributes:
      code:
        description: Stable item code used in inventories, snake_case.
        type: string
        required: true
        constraints:
          pattern: '^[a-z][a-z0-9_]*$'
      name:
        description: Name of the item as people read it.
        type: string
        required: true
      description:
        description: What the item is, as people read it.
        type: text
        required: true
        searchable: true
      category:
        description: What sort of thing it is.
        type: {enum: [food, material, tool, medicine, structure, artifact]}
        required: true
        indexed: true
      perishable:
        description: Whether the item spoils while carried.
        type: boolean
        required: true
      decay_per_day:
        description: Share of a carried perishable stock lost per day of the world; for structures, durability lost per day.
        type: decimal(8,4)
      durability:
        description: Uses before a tool breaks; days before a structure falls apart.
        type: decimal(8,2)
      nourish:
        description: Hunger removed by eating one unit.
        type: decimal(6,2)
      heal:
        description: Health restored by using one unit.
        type: decimal(6,2)
      protection:
        description: Share of the damage from cold and from the wilds that a carried unit wards off.
        type: decimal(4,3)
      boosts:
        description: Item codes whose gathering this tool improves.
        type: json
      boost:
        description: Multiplier of the gathered amount when the tool is used.
        type: decimal(6,2)
      source:
        description: Where it comes from - tile (food and wood of a tile), biome (gathered from the ground of some biomes), craft (only made).
        type: {enum: [tile, biome, craft]}
        required: true
      biomes:
        description: Biomes where it can be gathered.
        type: json
      gather_yield:
        description: Units gathered by one gathering on a suitable tile.
        type: decimal(6,2)
      min_distance:
        description: Fewest tiles from the centre of the world at which it is found.
        type: decimal(6,2)

  Signal:
    description: A signal people pick up in the campus (a trend, a user pain, market news, a research result, a regulatory change, what a customer said); carried, it can go into an idea or a work method.
    primary_key: [code]
    title_attribute: name
    attributes:
      code:
        description: Stable signal code used in inventories, snake_case.
        type: string
        required: true
        constraints:
          pattern: '^[a-z][a-z0-9_]*$'
      name:
        description: Short title of the signal as people read it.
        type: string
        required: true
        searchable: true
      description:
        description: The signal itself, as people read it.
        type: text
        required: true
        searchable: true
      category:
        description: What sort of signal it is.
        type: {enum: [trend, pain, market, research, regulation, customer]}
        required: true
        indexed: true
      perishable:
        description: Whether the signal gets stale while carried.
        type: boolean
        required: true
      decay_per_day:
        description: Share of a carried signal lost per day of the world.
        type: decimal(8,4)
      source:
        description: Always biome - picked up in the rooms listed in biomes.
        type: {enum: [biome]}
        required: true
      biomes:
        description: Rooms (tile biomes) where it can be picked up.
        type: json
      gather_yield:
        description: Units picked up at once.
        type: decimal(6,2)
      min_distance:
        description: Fewest tiles from the centre of the campus at which it is found.
        type: decimal(6,2)
      url:
        description: Official source of the signal (a public http/https page, e.g. the text of a regulation); whoever carries the signal or reads it on an idea may read that page with web_fetch.
        type: string

  Idea:
    description: An IT product idea of the hub. It lives on its own idea/ branch while people enrich and review it; it reaches main (the portfolio) only when the investment committee approves it.
    primary_key: [code]
    title_attribute: title
    attributes:
      code:
        description: Unique id of the idea, minted by the world (slug of the title and a suffix).
        type: string
        required: true
      title:
        description: Title of the idea.
        type: string
        required: true
        searchable: true
      problem:
        description: The problem, for whom and why it matters.
        type: text
        searchable: true
      users:
        description: Who the users are.
        type: text
        searchable: true
      solution:
        description: The proposed solution.
        type: text
        searchable: true
      differentiation:
        description: What sets it apart from what exists.
        type: text
        searchable: true
      feasibility:
        description: How and how much it can be built.
        type: text
        searchable: true
      risks:
        description: The main risks.
        type: text
        searchable: true
      tags:
        description: Domains and themes (list of short words).
        type: json
      stage:
        description: Where the idea is in the pipeline.
        type: {enum: [signal, insight, concept, proposal, pitch, approved, killed]}
        required: true
        indexed: true
      champion:
        description: Name of the person who proposed it and carries it.
        type: string
        indexed: true
      authors:
        description: Names of the people who wrote it (list).
        type: json
      scores:
        description: Mean of the reviews per dimension (impact, feasibility, novelty, fit, risk; 0-10).
        type: json
      branch:
        description: The idea/ branch it lives on.
        type: string
      proposal_id:
        description: The Proposal into main opened when it was submitted to the committee.
        type: string
      quarter:
        description: Quarter in which it was proposed (Q1-Q4).
        type: string
        indexed: true
      signals:
        description: Codes of the signals and work artifacts its authors brought in (list).
        type: json
      sources:
        description: Web pages its authors cite (list of {title, url}).
        type: json
      history:
        description: What happened to it (list of {at, by, action, note}).
        type: json
      decision:
        description: The committee's last decision ({decision, summary, at, votes}).
        type: json
      day:
        description: Day of the world on which it was proposed.
        type: integer
      session:
        description: Id of the world run in which it was proposed.
        type: string

  Review:
    description: A peer review of an idea (one per reviewer), written on the idea's branch.
    primary_key: [code]
    title_attribute: code
    attributes:
      code:
        description: Idea code and reviewer, minted by the world.
        type: string
        required: true
      idea:
        description: Code of the idea reviewed.
        type: string
        required: true
        indexed: true
      reviewer:
        description: Name of the reviewer.
        type: string
        required: true
      impact:
        description: Impact, 0-10.
        type: integer
        required: true
      feasibility:
        description: Feasibility, 0-10.
        type: integer
        required: true
      novelty:
        description: Novelty, 0-10.
        type: integer
        required: true
      fit:
        description: Fit with the strategic themes, 0-10.
        type: integer
        required: true
      risk:
        description: Risk, 0 (none) to 10 (very high).
        type: integer
        required: true
      comment:
        description: The reviewer's comment.
        type: text
        searchable: true
      day:
        description: Day of the world.
        type: integer
      minute:
        description: Minute of the day.
        type: integer

  Evidence:
    description: A piece of evidence behind an idea, written on the idea's branch (reaches main with the idea when approved). Simulated interviews always weigh 0 and are labelled as hypothesis.
    primary_key: [code]
    title_attribute: title
    attributes:
      code:
        description: Idea code and a suffix, minted by the world.
        type: string
        required: true
      idea:
        description: Code of the idea it supports.
        type: string
        required: true
        indexed: true
      type:
        description: Kind of evidence.
        type: {enum: [public_signal, human_validation, simulated_interview, web_source]}
        required: true
        indexed: true
      source:
        description: Where it comes from.
        type: {enum: [hackernews, github, stackoverflow, arxiv, web, player, persona]}
        required: true
        indexed: true
      url:
        description: Link to the source (empty for validations and interviews).
        type: string
      title:
        description: Title of the result or of the validation.
        type: string
        required: true
        searchable: true
      metric:
        description: Size of the signal at the source (points, stars, votes).
        type: decimal(14,2)
      metric_name:
        description: Name of the metric (points, stars, votes).
        type: string
      excerpt:
        description: Short excerpt, comment or simulated answers.
        type: text
        searchable: true
      collected_by:
        description: Name of who collected it (a person of the hub or a player).
        type: string
        indexed: true
      collected_at:
        description: When, in game time ({day, minute}).
        type: json
      weight:
        description: Weight from the policies when collected (0 for simulated interviews).
        type: decimal(8,3)
        required: true
      label:
        description: "ipotesi for simulated interviews, empty otherwise."
        type: string
      role:
        description: Role spoken for in validations and interviews (cliente, dpo, utente).
        type: string
      verdict:
        description: Verdict of a human validation (positivo, neutro, negativo).
        type: string
      session:
        description: Id of the world run in which it was collected.
        type: string

  Recipe:
    description: A work method that turns signals and artifacts into other artifacts; known only once its breakthrough is made (when it has one).
    primary_key: [code]
    title_attribute: name
    attributes:
      code:
        description: Stable recipe code, snake_case.
        type: string
        required: true
        constraints:
          pattern: '^[a-z][a-z0-9_]*$'
      name:
        description: Name of the recipe as people read it.
        type: string
        required: true
      description:
        description: What the recipe makes, as people read it.
        type: text
        searchable: true
      inputs:
        description: Items consumed, code -> amount.
        type: json
        required: true
      outputs:
        description: Items produced, code -> amount (a structure is built on the tile).
        type: json
        required: true
      tools:
        description: Tool codes needed (worn, not consumed).
        type: json
      role:
        description: Code of the role whose people know how to do it; empty for anyone.
        type: string
        indexed: true
      tech:
        description: Code of the breakthrough that unlocks it; empty when known from the start.
        type: string
        indexed: true
      station:
        description: Where it must be done - shelter or a structure code; empty by hand anywhere.
        type: string
      minutes:
        description: Work time in game minutes at work speed 1.
        type: decimal(8,2)
        required: true

  Breakthrough:
    description: A breakthrough of the hub that opens a new idea domain; making it makes its methods known.
    primary_key: [code]
    title_attribute: name
    attributes:
      code:
        description: Stable technology code, snake_case.
        type: string
        required: true
        constraints:
          pattern: '^[a-z][a-z0-9_]*$'
      name:
        description: Name of the technology as people read it.
        type: string
        required: true
      description:
        description: What the technology is, as people read it.
        type: text
        required: true
        searchable: true
      prerequisites:
        description: Codes of the breakthroughs that must be made first.
        type: json
      discovered:
        description: Whether the hub has made it.
        type: boolean
        required: true
        indexed: true
      discovered_by:
        description: Name of the person who discovered it.
        type: string
      discovered_role:
        description: Role of the person who discovered it.
        type: string
      discovered_day:
        description: Day of the world on which it was discovered.
        type: integer
      discovered_minute:
        description: Minute of the day at which it was discovered.
        type: integer
      session:
        description: Id of the world run in which it was discovered.
        type: string

relations:
  unlocked_by:
    inverse_api_name: unlocks
    description: The breakthrough that makes a method known.
    from_kind: Recipe
    to_kind: Breakthrough
    cardinality: many_to_one
  known_by:
    inverse_api_name: recipes
    description: The role whose people know a work method.
    from_kind: Recipe
    to_kind: Role
    cardinality: many_to_one
  consumes:
    inverse_api_name: consumed_by
    description: Items a recipe uses up.
    from_kind: Recipe
    to_kind: Resource
    cardinality: many_to_many
  produces:
    inverse_api_name: produced_by
    description: Items a recipe makes.
    from_kind: Recipe
    to_kind: Resource
    cardinality: many_to_many
  requires:
    inverse_api_name: required_by
    description: Breakthroughs that must be made before this one.
    from_kind: Breakthrough
    to_kind: Breakthrough
    cardinality: many_to_many
  held_by_role:
    inverse_api_name: insights
    description: The role whose playbook an entry belongs to.
    from_kind: Insight
    to_kind: Role
    cardinality: many_to_one

operations:
  enact_rule:
    description: Enact a brand-new policy directly on the live branch (no review).
    parameters:
      - name: code
        type: string
        required: true
        description: Stable identifier of the new law, snake_case.
      - name: value
        type: decimal(12,4)
        required: true
        description: Numeric value (1 for a law that only has a wording).
      - name: text
        type: text
        required: true
        description: Wording of the law as people read it.
      - name: category
        type: {enum: [survival, economy, climate, society, time, company, ideas, strategy, wellbeing]}
        required: true
        description: Area of life the law governs.
      - name: unit
        type: string
        required: false
        description: Unit of the value, for display.
    steps:
      - step: create_record
        kind: Rule
        values:
          code: params.code
          value: params.value
          text: params.text
          category: params.category
          unit: params.unit
    review_policy:
      mode: never

  share_insight:
    description: Record an insight of a social role (on a role/ branch; it reaches main through a peer-reviewed Proposal).
    parameters:
      - name: code
        type: string
        required: true
        description: Unique id of the insight.
      - name: role
        type: ref(Role)
        required: true
        description: The role whose shared consciousness it belongs to.
      - name: role_code
        type: string
        required: true
        description: Code of that role.
      - name: text
        type: text
        required: true
        description: The insight.
      - name: confidence
        type: decimal(4,3)
        required: true
        description: How sure the author is, 0 to 1.
      - name: author
        type: string
        required: true
        description: Name of the author.
      - name: day
        type: integer
        required: true
        description: Day of the world.
      - name: evidence
        type: text
        required: false
        description: What supports it.
    steps:
      - step: create_record
        kind: Insight
        values:
          code: params.code
          role: params.role_code
          text: params.text
          confidence: params.confidence
          author: params.author
          day: params.day
          evidence: params.evidence
          status: '"proposed"'
      - step: create_link
        relation: held_by_role
        from: $step[0]
        to: params.role
    review_policy:
      mode: never

  repeal_rule:
    description: Repeal a law directly on the live branch (no review).
    parameters:
      - name: rule
        type: ref(Rule)
        required: true
        description: The rule to repeal.
    steps:
      - step: delete_record
        kind: Rule
        target: params.rule
    review_policy:
      mode: never

  amend_rule:
    description: Change the wording, category and unit of one law directly on the live branch (no review).
    parameters:
      - name: rule
        type: ref(Rule)
        required: true
        description: The rule to amend.
      - name: text
        type: text
        required: true
        description: The new wording.
      - name: category
        type: {enum: [survival, economy, climate, society, time, company, ideas, strategy, wellbeing]}
        required: true
        description: The area of life it governs.
      - name: unit
        type: string
        required: false
        description: Unit of the value.
    steps:
      - step: update_record
        kind: Rule
        target: params.rule
        values:
          text: params.text
          category: params.category
          unit: params.unit
    review_policy:
      mode: never

  set_rule:
    description: Change the value of one law directly on the live branch (no review).
    parameters:
      - name: rule
        type: ref(Rule)
        required: true
        description: The rule to change.
      - name: value
        type: decimal(12,4)
        required: true
        description: The new value.
    steps:
      - step: update_record
        kind: Rule
        target: params.rule
        values:
          value: params.value
    review_policy:
      mode: never
